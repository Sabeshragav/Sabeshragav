name: Meendum Meendum ah

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (for testing)
  workflow_dispatch:

jobs:
  refresh-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README with timestamp
        run: |
          echo "<!-- Updated on: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S %Z') -->" >> README.md

      - name: Commit and push changes
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "New Day, New Beginning!"
          git push origin main
