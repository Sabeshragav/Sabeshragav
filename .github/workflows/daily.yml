  workflow_dispatch:       # Also allow manual runs

jobs:
  refresh-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # (Optional) Set up Node.js, Python, or any env if needed
