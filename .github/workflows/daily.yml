name: Meendum meendum ah

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes for testing
  workflow_dispatch:

jobs:
  refresh-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          # Remove previous timestamp line (if any)
          grep -v '^Last updated on ' README.md > temp.md || true

          # Add new timestamp
          echo "Last updated on $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S %Z')" >> temp.md

          # Overwrite the original README
          mv temp.md README.md

      - name: Commit and Push changes
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "New Day, New Beginning!"
          git push origin main
